name: Déploiement GitHub Pages

# Déploie le site statique (banc à perte de charge) sur GitHub Pages
# à chaque push sur la branche, et active Pages automatiquement.

on:
  push:
    branches:
      - claude/exciting-heisenberg-nekj96
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Pages (activation automatique)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Préparation du site
        run: |
          mkdir -p _site
          cp -r index.html css js assets README.md _site/

      - name: Téléversement de l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déploiement vers GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
